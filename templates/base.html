<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RoadsideAuto{% endblock %}</title>
  <meta name="description" content="{% block description %}Mechanical repairs, servicing and 4x4 maintenance.{% endblock %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#0d0f10',
            surface: '#171a1c',
            'surface-light': '#222629',
            'text-primary': '#f5f5f2',
            'text-secondary': '#b3b8ba',
            accent: '#d97706',
            'accent-hover': '#f59e0b',
            border: '#34393c',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-text-primary">
    {% include 'core/_header.html' %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% include 'core/_footer.html' %}
  </body>
</html>

<style>
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    textarea,
    select {
      background-color: #f5f5f2;
      color: #0d0f10;
      border: 1px solid #34393c;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
    }
    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #d97706;
    }
  </style>
