{% extends 'base.html' %}
{% block title %}Reset Password | RoadsideAuto{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-16">
  <h1 class="text-3xl font-bold mb-4">Reset Your Password</h1>
  <p class="text-text-secondary mb-6">Enter your email and we'll send you a link to reset your password.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-accent text-background px-6 py-3 rounded-md font-medium hover:bg-accent-hover w-full">
      Send Reset Link
    </button>
  </form>
</div>
{% endblock %}
