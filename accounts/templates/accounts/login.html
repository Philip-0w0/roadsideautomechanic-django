{% extends 'base.html' %}
{% block title %}Login | RoadsideAuto{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-16">
  <h1 class="text-3xl font-bold mb-6">Log In</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-accent text-background px-6 py-3 rounded-md font-medium hover:bg-accent-hover w-full">
      Log In
    </button>
  </form>
  <p class="text-text-secondary text-sm mt-2">
    <a href="{% url 'password_reset' %}" class="text-accent hover:text-accent-hover">Forgot your password?</a>
  </p>
  <p class="text-text-secondary text-sm mt-4">
    Don't have an account? <a href="{% url 'register' %}" class="text-accent hover:text-accent-hover">Register</a>
  </p>
</div>
{% endblock %}
